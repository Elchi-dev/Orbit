name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Build the interface
        run: bunx vite build
      - name: End to end against a running server (mock model)
        run: |
          ORBIT_HOME=$RUNNER_TEMP/orbit ORBIT_MOCK=1 ORBIT_NO_OPEN=1 PORT=7799 bun server/index.ts &
          for i in $(seq 1 20); do curl -fs http://localhost:7799/ >/dev/null && break; sleep 0.5; done
          bun scripts/smoke.ts http://localhost:7799
      - name: No dashes in source and docs
        run: bun scripts/lint-text.ts
      - name: Compatibility page matches the catalog
        run: bun scripts/gen-compat.ts --check
      - name: Built-in library matches server/library
        run: bun scripts/gen-library.ts --check
      - name: Remote protocol vectors unchanged
        run: bun scripts/gen-remote-vectors.ts --check
      - name: Editor extension
        run: node integrations/vscode/test.js

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (protocol vectors, state, screens) and a debug build
        run: ./gradlew --no-daemon test :app:assembleDebug
