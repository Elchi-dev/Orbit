name: release

# Runs when a release is published (the tag is created with it) or by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the binaries to, like v0.1.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Binaries for Linux, macOS and Windows
        run: bun run build
      - name: Editor extension
        working-directory: integrations/vscode
        run: |
          node test.js
          npx --yes @vscode/vsce@3 package --no-dependencies -o ../../release/orbit-vscode.vsix
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Relay binaries for Linux
        working-directory: relay
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          go vet ./...
          go test ./...
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o ../release/orbit-relay-linux-$arch .
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK licenses (the runner has the SDK; the build fetches the platform it needs)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Android app
        working-directory: android
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: |
          # the app's version follows the release tag
          v="${TAG#v}"; v="${v%%-*}"
          IFS=. read -r major minor patch <<< "$v"
          printf 'versionCode=%d\nversionName=%s\n' "$((major * 10000 + minor * 100 + patch))" "$v" > version.properties
          # with a signing key it is signed with it; without, with the debug key
          if [ -n "$ORBIT_KEYSTORE_BASE64" ]; then
            echo "$ORBIT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/orbit.keystore"
            export ORBIT_KEYSTORE="$RUNNER_TEMP/orbit.keystore"
          fi
          # the plain app: alerts through the relay, no Google
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../release/orbit-android.apk
          # with the project's Firebase file, a second build that can use Firebase too
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../release/orbit-android-firebase.apk
            rm app/google-services.json
          fi
      - name: Checksums
        working-directory: release
        run: sha256sum orbit-* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" release/* --clobber
