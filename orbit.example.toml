# orbit.toml, annotated.
#
# Orbit writes this file to ~/.orbit/orbit.toml on first start and keeps it in
# sync with the Settings screen: change either one, the other follows. Keys you
# leave out fall back to the values shown here. Set ORBIT_HOME to move the whole
# data folder (config, database, master key) somewhere else.

[server]
port = 7777
# Loopback only. Anything else exposes an agent with a shell on your machine to
# the network; Orbit then stops checking the Host header, but still requires the
# session cookie on every request.
host = "127.0.0.1"
open_browser = true

[models]
# Does the work in every workspace unless a workspace picks another model.
pilot = "claude-opus-5-5"
# Approves or refuses actions in Auto mode. It answers in one short JSON line, so
# a cheaper model keeps Auto fast without making it careless.
judge = "claude-sonnet-5-5"
# Names new workspaces and writes the summary when you clear a history.
scribe = "claude-haiku-5-5"
# How hard the main model thinks by default: low, medium, high, xhigh or max.
# The composer can change it for a single message.
effort = "medium"
# Hard limit for thinking plus reply in one response.
max_tokens = 32000
# "summarized" shows a readable thought trail, "omitted" hides it.
thinking_display = "summarized"

[permissions]
# Mode for new workspaces: "manual" (you approve), "auto" (the judge approves
# safe actions and asks you about the rest) or "rules" (only rules decide,
# everything else is blocked; for unattended runs).
default_mode = "manual"
# Read-only actions (file reads, ls, cat, rg, git status, git log...) run
# without a rule, a judge or a question. Turn this off to gate them too.
skip_readonly = true
# How many recent messages the judge sees besides your first and latest request.
judge_context_messages = 6
# When the judge has not answered after this long, Orbit asks you. It never
# falls back to allow.
judge_timeout_ms = 12000
# Plain language the judge must follow, in every workspace. Each workspace can
# add its own notes on top.
judge_notes = """
rm -rf inside the workspace folder is fine, don't block it.
Never touch ~/.ssh, ~/.aws or anything with "secret" in the path.
"""

# Rules are checked before the mode and decide instantly. The pattern is matched
# against the whole action: the command for shell, "write /abs/path" for file
# writes and edits, "fetch https://..." for web requests. * matches any text
# except shell operators (; & | ` $ ( ) < >), so an allow rule can never be
# stretched by chaining a second command onto it. kind = "regex" for a regular
# expression. Rules added with "Always allow" live in the database, per workspace.
[[permissions.rules]]
pattern = "rm -rf ./build/*"
verdict = "allow"

[[permissions.rules]]
pattern = "git push --force*"
verdict = "deny"

[[permissions.rules]]
pattern = "curl *"
verdict = "ask"

# What Claude may change in the interface itself. Each tool adds a few hundred
# tokens to every request while it is switched on.
[ui_tools]
auto_title = true   # the scribe names a new workspace after its first reply
set_title = true    # Claude renames the workspace when the topic changes
set_planet = true   # Claude picks the planet's colour and surface
notify = true       # desktop notifications when something finishes or needs you
pin = true          # facts pinned to the workspace's memory shelf
show = true         # charts and formatted notes in the conversation
widget = false      # small interactive HTML tools, sandboxed, without network

[ui]
motion = "full"     # "full", "calm" (the sky almost still) or "off"
sound = false
# Adds a short style guide to the system prompt: plain words, no filler, no emoji.
house_style = true

[budget]
# Orbit pauses a run and tells you when a limit is reached. 0 means no limit.
daily_usd = 20
workspace_usd = 5

[safety]
# Every file is saved before Claude writes or edits it, so changes can be undone
# one at a time from the Files panel. Files bigger than undo_max_bytes are not
# saved (and say so).
undo_journal = true
undo_max_bytes = 2000000
# A shell command running longer than this is stopped and its shell restarted.
command_timeout_s = 300

[workspaces]
# Where new workspaces get their folder when you don't pick one.
home = "~/orbit-workspaces"

[profile]
# Sent with every message in every workspace.
about = ""
instructions = ""

# USD per million tokens, used for the cost shown everywhere (checked October
# 2026; change them here when Anthropic's prices change). context is the
# model's window.
[pricing.claude-opus-5-5]
input = 4
output = 20
cache_write = 5
cache_read = 0.2
context = 1000000

[pricing.claude-sonnet-5-5]
input = 2
output = 10
cache_write = 2.5
cache_read = 0.1
context = 1000000

[pricing.claude-haiku-5-5]
input = 0.1
output = 0.5
cache_write = 0.125
cache_read = 0.01
context = 1000000

[pricing.claude-fable-5-1]
input = 10
output = 50
cache_write = 12.5
cache_read = 1
context = 1000000
